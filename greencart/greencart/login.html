<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenCart – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<script src="js/sprite.js"></script>

<main class="linen auth-wrap">
  <a class="back-link" href="index.html">&larr; Back</a>
  <div class="auth-card">
    <div class="mark"><svg width="46" height="46" aria-hidden="true"><use href="#gc-mark"/></svg><span class="word">GREENCART</span></div>
    <h1>Welcome Back.</h1>
    <p class="sub">Enter your details to continue shopping.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="l-user">Email or username</label>
        <div class="input-wrap"><input id="l-user" name="user" type="text" autocomplete="username" placeholder="name@example.com" maxlength="254" autocapitalize="none" spellcheck="false"></div>
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <div class="input-wrap">
          <input id="l-pass" class="has-eye" name="pass" type="password" autocomplete="current-password" placeholder="Enter your password" maxlength="128" aria-describedby="l-caps">
          <button type="button" class="eye" aria-label="Show password" data-eye="l-pass"><svg width="18" height="18"><use href="#i-eye"/></svg></button>
        </div>
        <p class="caps-hint" id="l-caps" aria-live="polite" hidden>Caps Lock is on.</p>
      </div>
      <p class="form-msg" id="l-msg" role="alert"></p>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>

    <a class="center-link" href="#" id="forgot">Forgot password?</a>
    <div class="swap">Don't have an account? <a href="register.html">Register</a></div>
  </div>
</main>

<script src="js/password-toggle.js"></script>
<script src="js/account.js"></script>
<script src="js/login.js"></script>
</body>
</html>
